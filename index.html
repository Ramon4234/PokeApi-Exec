<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Pokémon</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js"></script>
</head>

<body>
<div class="pokemon-card">

    <img
        id="pokemon-imagem" src="" alt="Charmander" class="pokemon-imagem">

    <h1 class="pokemon-nome" id="pokemon-nome">Charmander</h1>

    <span class="pokemon-id" id="pokemon-id">
        ID:
    </span>

    <div class="pokemon-info">

        <div class="info-box">
            <div class="info-titulo">Altura</div>
            <div class="info-valor" id="pokemon-altura"></div>
            <div class="info-unidade">decímetros</div>
        </div>

        <div class="info-box">
            <div class="info-titulo">Peso</div>
            <div class="info-valor" id="pokemon-peso"></div>
            <div class="info-unidade">hectogramas</div>
        </div>

    </div>


</body>

</html>
